name: lint

# 说明：本项目**无网页前端工程**（无 Vite/React/ESLint 前端流水线）。
# lint 只做三件事：Python 静态检查、契约文件 JSON 校验、多租户守卫扫描。

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  python-lint:
    name: python · ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff>=0.5"
      - name: Ruff check
        working-directory: server
        run: ruff check . && ruff format --check .

  contract-json:
    name: contracts · json 语法与计数
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path("packages/shared")
          files = sorted(root.rglob("*.json"))
          assert files, "未找到契约文件"
          for f in files:
              json.loads(f.read_text(encoding="utf-8"))
              print("ok", f)
          intents = json.loads((root / "contracts/intents.json").read_text(encoding="utf-8"))
          slots = json.loads((root / "contracts/slots.json").read_text(encoding="utf-8"))
          sources = json.loads((root / "contracts/source-enum.json").read_text(encoding="utf-8"))
          errors = json.loads((root / "contracts/error-codes.json").read_text(encoding="utf-8"))
          assert len(intents["intents"]) == 38, len(intents["intents"])
          assert len(slots["slots"]) == 18, len(slots["slots"])
          assert len(sources["sources"]) == 5, len(sources["sources"])
          assert len(errors["codes"]) >= 20
          print("contract counts ok: 38/18/5/%d" % len(errors["codes"]))
          PY

  tenant-guard:
    name: 多租户守卫 · 裸 SQL 扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan raw SQL without tenant_id
        run: python infra/ci/tenant-guard-scan.py

  miniprogram-typecheck:
    name: 小程序 · tsc 类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dev deps
        working-directory: miniprogram
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: miniprogram
        run: npm run typecheck
