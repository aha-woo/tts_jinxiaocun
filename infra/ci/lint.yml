name: lint

# 说明：本项目**无网页前端工程**（无 Vite/React/ESLint 前端流水线）。
# lint 只做三件事：Python 静态检查、契约文件 JSON 校验、多租户守卫扫描。
#
# ⚠️ **不在这里的一件**：小程序模板（WXML/WXSS）编译检查
# 它用的是微信开发者工具自带的 wcc.exe / wcsc.exe —— Windows PE 可执行文件，
# ubuntu-latest runner 上没有（也没有对应的 Linux 版）。所以它只能在 Windows 本地跑：
#     python miniprogram/scripts/check-templates.py
# 见 README §3.5。**CI 全绿不代表模板层验过**，发版前必须本地跑一次。

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  python-lint:
    name: python · ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff>=0.5"
      - name: Ruff check
        working-directory: server
        run: ruff check . && ruff format --check .

  contract-json:
    name: contracts · json 语法与计数
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path("packages/shared")
          files = sorted(root.rglob("*.json"))
          assert files, "未找到契约文件"
          for f in files:
              json.loads(f.read_text(encoding="utf-8"))
              print("ok", f)
          intents = json.loads((root / "contracts/intents.json").read_text(encoding="utf-8"))
          slots = json.loads((root / "contracts/slots.json").read_text(encoding="utf-8"))
          sources = json.loads((root / "contracts/source-enum.json").read_text(encoding="utf-8"))
          errors = json.loads((root / "contracts/error-codes.json").read_text(encoding="utf-8"))
          assert len(intents["intents"]) == 38, len(intents["intents"])
          assert len(slots["slots"]) == 18, len(slots["slots"])
          assert len(sources["sources"]) == 5, len(sources["sources"])
          assert len(errors["codes"]) >= 20
          print("contract counts ok: 38/18/5/%d" % len(errors["codes"]))
          PY

  tenant-guard:
    name: 多租户守卫 · 裸 SQL 扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan raw SQL without tenant_id
        run: python infra/ci/tenant-guard-scan.py

  miniprogram-typecheck:
    name: 小程序 · tsc 类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dev deps
        working-directory: miniprogram
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: miniprogram
        run: npm run typecheck

  plugin-config:
    name: 小程序 · 同声传译插件配置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 校验 app.json 里 plugins.WechatSI 的 provider / version / scope.record.desc。
      # ⚠️ 这**抓不到**「版本号与后台不一致」——后台没有开放 API 读版本号，
      # 只能人工看一眼「插件管理 → 详情」。发布前请本地跑一次：
      #     WECHATSI_VERSION=<后台详情页的版本号> python miniprogram/scripts/check-plugin-config.py
      - name: Check plugin config
        run: python miniprogram/scripts/check-plugin-config.py
