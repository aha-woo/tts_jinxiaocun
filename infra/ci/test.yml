name: test

# T01 起到「契约 + 双端工具 + 健康检查」的回归保护；T02+ 逐层追加
# （双租户越权 / 模板命中 / 快照 vs 增量 / 影响预演只读 / 计费幂等 / 发货幂等 / 100K 断言）。

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  server-tests:
    name: server · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        working-directory: server
        env:
          APP_ENV: test
        run: pytest -q

  smoke-healthz:
    name: server · /healthz 冒烟
    runs-on: ubuntu-latest
    needs: server-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" "pydantic>=2.6"
      - name: Boot and curl /healthz
        working-directory: server
        run: |
          uvicorn app.main:app --port 8000 --log-level warning &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz > /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/health.json"))
          assert data["code"] == 0, data
          counts = data["data"]["contract"]
          assert counts["intents"] == 38, counts
          assert counts["slots"] == 18, counts
          assert counts["sources"] == 5, counts
          print("healthz ok:", counts)
          PY
          kill $SERVER_PID
