# Alembic configuration (database migrations).
#
# NOTE: this file is kept ASCII-only on purpose. Alembic reads the ini with
# encoding="locale" (GBK on zh-CN Windows), so non-ASCII comments would break
# `alembic -c alembic.ini ...`. Put the Chinese rationale in migrations/env.py.
#
# Usage (run from server/, `prepend_sys_path = .` relies on cwd):
#   alembic upgrade head                    # forward (needs PG, or a local SQLite file)
#   alembic upgrade head --sql > schema.sql # offline PG DDL render (no DB needed; CI evidence)
#   alembic downgrade base                  # rollback
#
# URL precedence (see migrations/env.py):
#   1) config.attributes["database_url"]  (explicit, used by tests/tooling)
#   2) env var DATABASE_URL              (cloud hosting / CI)
#   3) sqlalchemy.url below
#
# Production must use plan A' (PostgreSQL bundled with a CloudBase PG-mode env,
# reached over the same-VPC private network) with a non-BYPASSRLS application role,
# otherwise FORCE ROW LEVEL SECURITY can still be bypassed.
# Inject the full DATABASE_URL: the PG* libpq variables are NOT read by this app.
# Business-table schema (dedicated schema vs public) is still open (arch Q26);
# when it changes, version_table_schema in migrations/env.py must change with it.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url = postgresql+psycopg://vil:vil@localhost:5432/vil

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
