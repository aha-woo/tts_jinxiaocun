[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-inventory-lite-server"
version = "0.1.0"
description = "语音录入版轻量化进销存 · 微信云托管容器后端（FastAPI）"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6,<3",
  # 外挂托管 Redis（云托管不部署有状态服务，见架构 D7/§4.5）；未配置时自动降级内存
  "redis>=5,<7",
  # 数据层：外挂托管 PostgreSQL（方案 A）+ RLS；SQLite 仅本地/测试
  "sqlalchemy>=2.0.30,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.1,<4",
  # JWT：wx.login -> openid -> tenant_id
  "PyJWT>=2.8,<3",
  # 微信 code2session（RealWxProvider）；FakeWxProvider 不走网络
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
# 测试与本地开发（T01 只需这三件；T02+ 再加 sqlalchemy/alembic/psycopg 等）
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[tool.setuptools]
packages = [
  "app",
  "app.api",
  "app.api.v1",
  "app.common",
  "app.db",
  "app.models",
  "app.schemas",
  "app.services",
  "app.tenant",
  "app.utils",
]

[tool.pytest.ini_options]
# 测试从 server/ 目录跑：cd server && pytest -q
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001"]
